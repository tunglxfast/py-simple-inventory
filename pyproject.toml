[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py-simple-inventory"
version = "0.1.0"
description = "Desktop warehouse management app with Tkinter + SQLite"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
excel = ["openpyxl>=3.1.0"]
build = ["pyinstaller>=6.0.0", "openpyxl>=3.1.0"]
gui = ["PySide6>=6.7.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = ["database", "services", "ui", "ui_qt"]
py-modules = ["app_paths", "app", "app_qt"]
