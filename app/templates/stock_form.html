{% extends "base.html" %}
{% block content %}
<h1 class="page-title">{{ title }}</h1>
{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
<form method="post" action="/stock/{{ document_type }}" class="panel" data-confirm="Bạn có chắc muốn lưu phiếu này?">
  <div class="row g-3 mb-4">
    <div class="col-md-3">
      <label class="form-label">Ngày</label>
      <input class="form-control" type="date" name="document_date" value="{{ today }}" required>
    </div>
    <div class="col-md-3">
      <label class="form-label">Khu vực</label>
      <select class="form-select" name="area_id" required>
        {% for area in areas %}<option value="{{ area.id }}">{{ area.name }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-md-3">
      <label class="form-label">Diễn giải</label>
      <input class="form-control" name="description" placeholder="Tên khách hàng">
    </div>
    <div class="col-md-3">
      <label class="form-label">Nhân viên đề xuất</label>
      <input class="form-control" name="proposed_by">
    </div>
    <div class="col-12">
      <label class="form-label">Ghi chú</label>
      <input class="form-control" name="note">
    </div>
  </div>
  <h2 class="h5 mb-2">Dòng hàng</h2>
  <table class="table align-middle">
    <thead><tr><th>Mã hàng</th><th style="width: 180px;">Số lượng</th><th>Ghi chú</th><th style="width: 80px;"></th></tr></thead>
    <tbody id="stock-lines">
      <tr id="add-stock-line-row">
        <td colspan="4" class="text-center">
          <button class="btn btn-outline-primary btn-sm" type="button" onclick="addStockLine()">Thêm sản phẩm</button>
        </td>
      </tr>
    </tbody>
  </table>
  <button class="btn btn-primary" type="submit">Lưu phiếu</button>
</form>
<template id="stock-line-template">
  <tr>
    <td>
      <select class="form-select" name="product_id" required>
        {% for product in products %}<option value="{{ product.id }}">{{ product.code }} - {{ product.name }}</option>{% endfor %}
      </select>
    </td>
    <td><input class="form-control" name="quantity" type="number" min="1" value="1" required></td>
    <td><input class="form-control" name="line_note"></td>
    <td><button class="btn btn-outline-danger btn-sm" type="button" onclick="removeStockLine(this)">Xoá</button></td>
  </tr>
</template>
{% endblock %}
