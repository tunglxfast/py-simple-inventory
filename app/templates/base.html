<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or "Quản lý kho" }}</title>
  <link rel="stylesheet" href="/static/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/app.css">
  <script defer src="/static/vendor/bootstrap.bundle.min.js"></script>
  <script defer src="/static/vendor/htmx.min.js"></script>
  <script defer src="/static/vendor/alpine.min.js"></script>
  <script defer src="/static/js/app.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="app-sidebar">
      <div class="app-brand">Quản lý kho</div>
      <nav class="app-nav d-grid gap-1">
        <a href="/products">Sản phẩm</a>
        <a href="/areas">Khu vực</a>
        <a href="/stock/IN">Nhập kho</a>
        <a href="/stock/OUT">Xuất kho</a>
        <a href="/documents">Lịch sử phiếu</a>
        <a href="/reports/inventory">Báo cáo</a>
        <a href="/inventory/adjust">Điều chỉnh tồn kho</a>
        <form method="post" action="/logout" class="mt-3">
          <button class="btn btn-link p-2 text-decoration-none" type="submit">Thoát</button>
        </form>
      </nav>
    </aside>
    <main class="app-content">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
