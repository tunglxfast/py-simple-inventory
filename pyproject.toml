[project]
name = "py-simple-inventory"
version = "0.1.0"
description = "Offline inventory management app for Windows."
readme = "PROJECT_PLAN.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "jinja2>=3.1.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "bcrypt>=4.1.0",
    "httpx>=0.27.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "python-dotenv>=1.0.0",
    "pywebview>=5.0",
    "pyinstaller>=6.0",
    "python-multipart>=0.0.9",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

